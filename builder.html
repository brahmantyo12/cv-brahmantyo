<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Generator - Glassmorphism</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; background: #111; color: #fff; }
        
        /* Panel Kiri: Editor */
        .editor {
            width: 40%;
            background: #222;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #444;
        }
        
        .editor h2 { color: #FFD700; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        input, textarea { 
            width: 100%; padding: 10px; background: #333; border: 1px solid #555; 
            color: #fff; border-radius: 5px; outline: none;
        }
        input:focus, textarea:focus { border-color: #FFD700; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button {
            padding: 12px; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%;
        }
        .btn-generate { background: #FFD700; color: #000; }
        .btn-download { background: #28a745; color: #fff; }

        /* Panel Kanan: Preview */
        .preview-area {
            width: 60%;
            background: #1e3c72; /* Background default preview */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="editor">
        <h2>🛠️ CV Builder</h2>
        <p style="font-size: 0.8rem; color: #ccc;">Isi data di bawah, preview akan update otomatis.</p>
        
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="inpName" value="Brahmantyo Tedywisesa" oninput="updatePreview()">
        </div>
        
        <div class="form-group">
            <label>Bio / Headline</label>
            <input type="text" id="inpBio" value="IT Professional | Network Specialist" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label>Link Foto Profil (Nama File/URL)</label>
            <input type="text" id="inpPhoto" value="profile_photo.jpg" oninput="updatePreview()">
        </div>

        <hr style="border-color: #444; margin: 20px 0;">
        
        <div class="form-group">
            <label>Email</label>
            <input type="text" id="inpEmail" value="brahmantyo12@gmail.com" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Nomor WhatsApp (format: 628...)</label>
            <input type="text" id="inpWA" value="6281703792075" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Link LinkedIn</label>
            <input type="text" id="inpLinkedin" value="https://linkedin.com/in/..." oninput="updatePreview()">
        </div>

        <div class="btn-group">
            <button class="btn-download" onclick="downloadHTML()">💾 Download index.html</button>
        </div>
        
        <p style="font-size: 0.7rem; color: #777; margin-top: 15px;">
            Catatan: Pastikan file 'style.css' dan 'script.js' tetap ada di folder yang sama dengan hasil download.
        </p>
    </div>

    <div class="preview-area">
        <iframe id="previewFrame"></iframe>
    </div>

    <script>
        // Template HTML dasar (Bagian atas dan bawah yang statis)
        // Kita menyuntikkan variable ke dalam string ini
        function getHTMLContent(data) {
            return `
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio ${data.name}</title>
    <link rel="stylesheet" href="style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
    <div class="container">
        <div class="profile">
            <img src="${data.photo}" alt="Foto Profil" class="avatar">
            <h1>${data.name}</h1>
            <p class="bio">${data.bio}</p>
            <div class="social-icons">
                <a href="mailto:${data.email}"><i class="fas fa-envelope"></i> Email</a>
                <a href="https://wa.me/${data.wa}" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                <a href="${data.linkedin}" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
            </div>
        </div>

        <div class="links">
            <button class="accordion">Experiences</button>
            <div class="panel">
                <p style="text-align:center; color:#ddd;">(Isi Experience bisa diedit manual di HTML)</p>
            </div>
            
            <button class="accordion">Skills</button>
            <div class="panel">
                <p style="text-align:center; color:#ddd;">(Isi Skills bisa diedit manual di HTML)</p>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 ${data.name}</p>
        </footer>
    </div>
    <script src="script.js"><\/script>
</body>
</html>
            `;
        }

        // Fungsi Update Preview Realtime
        function updatePreview() {
            const data = {
                name: document.getElementById('inpName').value,
                bio: document.getElementById('inpBio').value,
                photo: document.getElementById('inpPhoto').value,
                email: document.getElementById('inpEmail').value,
                wa: document.getElementById('inpWA').value,
                linkedin: document.getElementById('inpLinkedin').value
            };

            const htmlContent = getHTMLContent(data);
            const iframe = document.getElementById('previewFrame');
            const doc = iframe.contentWindow.document;
            
            doc.open();
            doc.write(htmlContent);
            doc.close();
            
            // Inject CSS agar preview terlihat bagus meskipun file css lokal mungkin tidak terbaca di iframe blob
            // Ini trik agar preview di browser tetap biru glassmorphism
            const styleElement = doc.createElement('style');
            styleElement.textContent = `
                body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); display:flex; justify-content:center; padding:20px; font-family:'Poppins'; color:white; }
                .container { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; text-align: center; width:100%; max-width:400px; border: 1px solid rgba(255,255,255,0.2); }
                .avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid white; object-fit: cover; }
                .social-icons a { display:inline-block; margin:5px; padding:8px 15px; border:1px solid white; border-radius:20px; color:white; text-decoration:none; font-size:0.8rem; }
                .accordion { background:white; color:#333; width:100%; padding:15px; border:none; border-radius:10px; margin-top:10px; font-weight:bold; cursor:pointer;}
            `;
            doc.head.appendChild(styleElement);
        }

        // Fungsi Download File HTML
        function downloadHTML() {
            const data = {
                name: document.getElementById('inpName').value,
                bio: document.getElementById('inpBio').value,
                photo: document.getElementById('inpPhoto').value,
                email: document.getElementById('inpEmail').value,
                wa: document.getElementById('inpWA').value,
                linkedin: document.getElementById('inpLinkedin').value
            };

            const htmlContent = getHTMLContent(data);
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'index.html';
            link.click();
        }

        // Jalankan saat pertama load
        window.onload = updatePreview;
    </script>
</body>
</html>
