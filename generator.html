<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Generator V4 (ATS Friendly)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/downloadjs/1.4.8/download.min.js"></script>

    <style>
        /* --- CSS EDITOR UI (Dark Mode) --- */
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; background: #121212; color: #eee; }
        
        .editor {
            width: 40%; background: #1e1e1e; 
            border-right: 1px solid #333; box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            height: 100vh;
        }

        .editor-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 40px; }
        .editor-content::-webkit-scrollbar { width: 8px; }
        .editor-content::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        
        .action-bar {
            flex-shrink: 0; background: #181818; padding: 20px;
            border-top: 1px solid #333; display: flex; flex-direction: column; gap: 10px;
            z-index: 10; box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }

        h2 { color: #FFD700; border-bottom: 2px solid #333; padding-bottom: 10px; margin-top: 0; }
        h3 { color: #aaa; margin-top: 25px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 5px; }
        
        input, textarea, select { 
            width: 100%; padding: 10px; background: #2d2d2d; border: 1px solid #444; 
            color: #fff; border-radius: 6px; outline: none; font-size: 0.9rem; transition: 0.3s;
        }
        input:focus, textarea:focus, select:focus { border-color: #FFD700; background: #333; }
        textarea { resize: vertical; min-height: 80px; }

        .dynamic-item {
            background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #333;
            margin-bottom: 10px; position: relative; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn-remove {
            position: absolute; top: 10px; right: 10px; background: #ff4757; color: white; border: none;
            width: 25px; height: 25px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .btn-add {
            background: #2f3542; color: #FFD700; border: 1px dashed #FFD700;
            width: 100%; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 5px;
        }
        .btn-add:hover { background: #FFD700; color: #000; }

        .btn-group { display: flex; gap: 10px; }
        .btn-action {
            flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; text-align: center;
        }
        .btn-html { background: #2980b9; } 
        .btn-pdf { background: #fff; color: #333; border: 1px solid #ccc; } /* Putih untuk ATS PDF Style */ 

        /* --- PREVIEW AREA --- */
        .preview-area {
            width: 60%; background: #555; /* Neutral background */
            display: flex; justify-content: center; align-items: flex-start; padding: 40px; overflow-y: auto;
        }
        #render-target {
            width: 100%; max-width: 500px; transform-origin: top center;
        }
    </style>
</head>
<body>

    <div class="editor">
        <div class="editor-content">
            <h2>📃 CV Generator V4 (ATS)</h2>
            
            <h3>1. Profile & Photo</h3>
            <div class="form-group">
                <label>Upload Foto (Opsional)</label>
                <input type="file" id="pPhotoInput" accept="image/*">
            </div>
            <div class="form-group"><label>Nama Lengkap</label><input type="text" id="pName" placeholder="Contoh: John Doe" oninput="updateUI()"></div>
            <div class="form-group"><label>Headline / Bio</label><input type="text" id="pBio" placeholder="Network Engineer | IT Support" oninput="updateUI()"></div>

            <h3>2. Contacts</h3>
            <div class="form-group"><label>Email</label><input type="text" id="cEmail" placeholder="email@contoh.com" oninput="updateUI()"></div>
            <div class="form-group"><label>WhatsApp</label><input type="text" id="cWa" placeholder="62812345678" oninput="updateUI()"></div>
            <div class="form-group"><label>LinkedIn URL</label><input type="text" id="cLinkedin" placeholder="https://linkedin.com/in/..." oninput="updateUI()"></div>

            <h3>3. Experiences</h3>
            <div id="exp-container"></div>
            <button class="btn-add" onclick="addExperience()">+ Tambah Pengalaman</button>

            <h3>4. Projects</h3>
            <div id="proj-container"></div>
            <button class="btn-add" onclick="addProject()">+ Tambah Project</button>
            
            <h3>5. Skills</h3>
            <div id="skill-container"></div>
            <button class="btn-add" onclick="addSkill()">+ Tambah Skill</button>
        </div>

        <div class="action-bar">
            <label style="text-align:center; color:#FFD700; font-size:0.8rem;">Download Options</label>
            <button class="btn-action btn-html" onclick="downloadWebHTML()"><i class="fas fa-globe"></i> HTML (Web Portfolio - Blue)</button>
            <div class="btn-group">
                <button class="btn-action btn-pdf" onclick="exportATSPDF()"><i class="fas fa-file-pdf"></i> PDF (ATS Clean Style)</button>
            </div>
        </div>
    </div>

    <div class="preview-area">
        <div id="render-target">
            </div>
    </div>

    <script>
        // --- A. KONFIGURASI CSS ---
        
        // 1. CSS WEB (Glassmorphism - Biru)
        const webCSS = `
            * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
            body { 
                background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
                color: #fff; min-height: 100vh; display: flex; justify-content: center; padding: 20px; 
            }
            .container {
                background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
                width: 100%; max-width: 500px; padding: 30px; border-radius: 20px;
                border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            }
            .avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #fff; object-fit: cover; margin-bottom: 15px; margin: 0 auto; display:block;}
            .header-text { text-align: center; margin-bottom: 20px; }
            h1 { font-size: 1.6rem; margin-bottom: 5px; }
            .bio { font-size: 0.9rem; color: #ddd; margin-bottom: 15px; }
            .contacts { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
            .contacts a { 
                color: #fff; text-decoration: none; padding: 5px 12px; border: 1px solid rgba(255,255,255,0.5); 
                border-radius: 20px; font-size: 0.8rem; background: rgba(0,0,0,0.2);
            }
            
            /* Section Headers (Pengganti Accordion) */
            .section-title {
                border-bottom: 1px solid rgba(255,255,255,0.2); color: #FFD700;
                font-size: 1.1rem; font-weight: 600; margin-top: 25px; margin-bottom: 15px; padding-bottom: 5px;
                text-transform: uppercase; letter-spacing: 1px;
            }
            
            /* Content Layout */
            .job-item { margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
            .job-item:last-child { border: none; }
            .job-item h3 { font-size: 1rem; color: #fff; }
            .job-item p { font-size: 0.85rem; color: #ddd; margin-top: 2px; }
            .job-item ul { margin-top: 5px; padding-left: 15px; color: #ccc; font-size: 0.85rem; }
            
            .skill-list { list-style: none; padding: 0; }
            .skill-list li { margin-bottom: 8px; display: flex; align-items: center; color: #eee; font-size: 0.9rem; }
            
            footer { text-align: center; margin-top: 30px; font-size: 0.7rem; color: rgba(255,255,255,0.5); }
        `;

        // 2. CSS ATS (Clean - Putih Hitam)
        // Ini akan di-inject HANYA saat download PDF
        const atsCSS = `
            * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif !important; color: #000 !important; }
            body { background: #fff !important; padding: 0 !important; }
            .container {
                background: #fff !important; width: 100% !important; max-width: 100% !important;
                padding: 0 !important; border: none !important; box-shadow: none !important; backdrop-filter: none !important;
            }
            .avatar { width: 100px; height: 100px; border-radius: 0; border: none; margin-bottom: 10px; }
            .header-text { text-align: left; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 20px; }
            h1 { font-size: 24px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
            .bio { color: #333 !important; font-style: italic; }
            .contacts { justify-content: flex-start; gap: 15px; }
            .contacts a { 
                border: none; padding: 0; background: none; color: #000; text-decoration: underline; 
            }
            
            .section-title {
                border-bottom: 1px solid #000; color: #000 !important;
                font-size: 14px; font-weight: bold; margin-top: 20px; margin-bottom: 10px;
            }
            
            .job-item h3 { font-weight: bold; font-size: 14px; }
            .job-item p { color: #333 !important; }
            .job-item ul { color: #000 !important; }
            footer { display: none; } /* Hide footer on PDF */
        `;

        // --- B. LOGIC ---
        let profilePhotoBase64 = ""; 

        document.getElementById('pPhotoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) { profilePhotoBase64 = evt.target.result; updateUI(); };
                reader.readAsDataURL(file);
            }
        });

        const skillIcons = [
            {val: "other", label: "Other (No Icon)"},
            {val: "fas fa-network-wired", label: "Network"},
            {val: "fas fa-server", label: "Server"},
            {val: "fas fa-code", label: "Code"},
            {val: "fab fa-python", label: "Python"},
            {val: "fas fa-users", label: "Community"},
            {val: "fas fa-language", label: "Language"}
        ];

        function generateContent() { 
            const name = document.getElementById('pName').value || "Nama Lengkap";
            const bio = document.getElementById('pBio').value || "Posisi Pekerjaan";
            const email = document.getElementById('cEmail').value || "email@domain.com";
            const wa = document.getElementById('cWa').value || "081...";
            const linkedin = document.getElementById('cLinkedin').value || "#";
            const photoSrc = profilePhotoBase64 || "https://via.placeholder.com/150";

            let expHTML = '';
            document.querySelectorAll('.experience-item').forEach(item => {
                const role = item.querySelector('.exp-role').value || "Posisi";
                const comp = item.querySelector('.exp-comp').value || "Perusahaan";
                const descList = (item.querySelector('.exp-desc').value || "").split('\n').map(l => l ? `<li>${l}</li>` : '').join('');
                expHTML += `<div class="job-item"><h3>${role}</h3><p><strong>${comp}</strong></p><ul>${descList}</ul></div>`;
            });

            let projHTML = '';
            document.querySelectorAll('.project-item').forEach(item => {
                const name = item.querySelector('.proj-name').value || "Project";
                const tech = item.querySelector('.proj-tech').value || "Tech";
                const desc = item.querySelector('.proj-desc').value || "";
                projHTML += `<div class="job-item"><h3>${name}</h3><p><strong>${tech}</strong></p><p style="margin-top:5px;">${desc}</p></div>`;
            });

            let skillHTML = '';
            document.querySelectorAll('.skill-item').forEach(item => {
                const iconClass = item.querySelector('.skill-select').value;
                const name = item.querySelector('.skill-name').value || "Skill";
                let iconHTML = (iconClass === 'other') ? `<span style="margin-right:10px;">•</span>` : `<i class="${iconClass}" style="width: 25px; margin-right: 5px;"></i>`;
                skillHTML += `<li>${iconHTML} ${name}</li>`;
            });

            return `
                <div class="container">
                    <div class="header-text">
                        <img src="${photoSrc}" class="avatar">
                        <h1>${name}</h1>
                        <p class="bio">${bio}</p>
                        <div class="contacts">
                            <a href="mailto:${email}">${email}</a>
                            <a href="https://wa.me/${wa}">WhatsApp</a>
                            <a href="${linkedin}">LinkedIn</a>
                        </div>
                    </div>
                    
                    <div class="section-title">Experiences</div>
                    <div>${expHTML}</div>

                    ${projHTML ? `<div class="section-title">Key Projects</div><div>${projHTML}</div>` : ''}

                    <div class="section-title">Skills</div>
                    <ul class="skill-list">${skillHTML}</ul>
                    
                    <footer>&copy; 2025 ${name}</footer>
                </div>
            `;
        }

        function updateUI() {
            // Default Preview pakai Web Style (Biru)
            const html = generateContent();
            const target = document.getElementById('render-target');
            target.innerHTML = `<style>${webCSS}</style>` + html;
        }

        // --- EXPORT FUNCTIONS ---

        // 1. Download HTML (Web Portfolio - Biru)
        function downloadWebHTML() {
            const content = generateContent();
            const finalHTML = `<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Portofolio</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/><style>${webCSS}</style></head><body>${content}</body></html>`;
            download(finalHTML, "index.html", "text/html");
        }

        // 2. Download PDF (ATS Style - Putih Bersih)
        function exportATSPDF() {
            const target = document.getElementById('render-target');
            const originalHTML = target.innerHTML; // Simpan tampilan biru
            
            // 1. Ganti tampilan sementara jadi Putih (ATS Style)
            const rawContent = generateContent(); // Ambil HTML mentah tanpa style
            target.innerHTML = `<style>${atsCSS}</style>` + rawContent; // Inject ATS CSS
            
            // 2. Render PDF
            const opt = { 
                margin: 10, 
                filename: 'CV_ATS_Friendly.pdf', 
                image: { type: 'jpeg', quality: 0.98 }, 
                html2canvas: { scale: 2 }, 
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
            };
            
            html2pdf().set(opt).from(target).save().then(() => {
                // 3. Kembalikan tampilan ke Biru setelah download selesai
                target.innerHTML = originalHTML;
            });
        }

        // --- HELPER FUNCTIONS ---
        function createInput(ph, cls, type="text") {
            const el = document.createElement(type==='textarea'?'textarea':'input');
            el.placeholder = ph; el.className = cls; el.oninput = updateUI; return el;
        }
        function createRemoveBtn(parent) {
            const btn = document.createElement('button'); btn.className='btn-remove'; btn.innerHTML='×';
            btn.onclick = ()=>{ parent.remove(); updateUI(); }; return btn;
        }
        function addExperience() {
            const c = document.getElementById('exp-container');
            const d = document.createElement('div'); d.className='dynamic-item experience-item';
            d.appendChild(createRemoveBtn(d));
            d.appendChild(createInput('Posisi', 'exp-role'));
            d.appendChild(createInput('Perusahaan', 'exp-comp'));
            d.appendChild(createInput('Deskripsi', 'exp-desc', 'textarea'));
            c.appendChild(d); updateUI();
        }
        function addProject() {
            const c = document.getElementById('proj-container');
            const d = document.createElement('div'); d.className='dynamic-item project-item';
            d.appendChild(createRemoveBtn(d));
            d.appendChild(createInput('Nama Project', 'proj-name'));
            d.appendChild(createInput('Teknologi', 'proj-tech'));
            d.appendChild(createInput('Deskripsi', 'proj-desc', 'textarea'));
            c.appendChild(d); updateUI();
        }
        function addSkill() {
            const c = document.getElementById('skill-container');
            const d = document.createElement('div'); d.className='dynamic-item skill-item'; d.style.display="flex"; d.style.gap="10px";
            d.appendChild(createRemoveBtn(d));
            const sel = document.createElement('select'); sel.className='skill-select';
            skillIcons.forEach(opt => { const o = document.createElement('option'); o.value=opt.val; o.innerText=opt.label; sel.appendChild(o); });
            sel.onchange=updateUI; d.appendChild(sel);
            d.appendChild(createInput('Nama Skill', 'skill-name'));
            c.appendChild(d); updateUI();
        }

        window.onload = function() { addExperience(); addSkill(); updateUI(); }
    </script>
</body>
</html>
