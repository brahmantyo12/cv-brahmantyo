<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CV Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        /* CSS KHUSUS UNTUK HALAMAN GENERATOR */
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; background: #121212; color: #eee; }
        
        /* --- PANEL KIRI (EDITOR) --- */
        .editor {
            width: 40%;
            background: #1e1e1e;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        .editor::-webkit-scrollbar { width: 8px; }
        .editor::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        
        h2 { color: #FFD700; border-bottom: 2px solid #333; padding-bottom: 10px; margin-top: 0; font-size: 1.2rem; }
        h3 { color: #aaa; margin-top: 25px; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 5px; }
        
        input, textarea, select { 
            width: 100%; padding: 10px; background: #2d2d2d; border: 1px solid #444; 
            color: #fff; border-radius: 6px; outline: none; font-size: 0.9rem; transition: 0.3s;
        }
        input:focus, textarea:focus { border-color: #FFD700; background: #333; }
        textarea { resize: vertical; min-height: 80px; }

        /* Kartu Item Dinamis (Experience/Project) */
        .dynamic-item {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 10px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn-remove {
            position: absolute; top: 10px; right: 10px;
            background: #ff4757; color: white; border: none;
            width: 25px; height: 25px; border-radius: 50%;
            cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; justify-content: center;
        }

        .btn-add {
            background: #2f3542; color: #FFD700; border: 1px dashed #FFD700;
            width: 100%; padding: 10px; border-radius: 6px; cursor: pointer;
            font-weight: 600; margin-top: 5px; transition: 0.3s;
        }
        .btn-add:hover { background: #FFD700; color: #000; }

        .action-bar {
            position: sticky; bottom: 0; background: #1e1e1e; padding: 20px 0;
            border-top: 1px solid #333; display: flex; gap: 10px;
        }
        .btn-download { background: #2ecc71; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-download:hover { background: #27ae60; }

        /* --- PANEL KANAN (PREVIEW) --- */
        .preview-area {
            width: 60%;
            background: #0f2027; /* Fallback */
            background: linear-gradient(to right, #2c5364, #203a43, #0f2027);
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        
        iframe {
            width: 100%; height: 100%; border: none; background: transparent;
            border-radius: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="editor">
        <h2>⚡ CV Builder <span style="font-size:0.8rem; color:#666;">v2.0</span></h2>

        <h3>Profile Info</h3>
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="pName" value="Brahmantyo Tedywisesa" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Headline / Bio</label>
            <input type="text" id="pBio" value="IT Professional | Network Specialist" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Foto Profil (Filename)</label>
            <input type="text" id="pPhoto" value="profile_photo.jpg" oninput="updatePreview()">
        </div>

        <h3>Social Media</h3>
        <div class="form-group"><label>Email</label><input type="text" id="cEmail" value="brahmantyo12@gmail.com" oninput="updatePreview()"></div>
        <div class="form-group"><label>WhatsApp (Format: 628...)</label><input type="text" id="cWa" value="6281703792075" oninput="updatePreview()"></div>
        <div class="form-group"><label>LinkedIn URL</label><input type="text" id="cLinkedin" value="#" oninput="updatePreview()"></div>

        <h3>Experiences</h3>
        <div id="exp-container"></div>
        <button class="btn-add" onclick="addExperience()">+ Tambah Pengalaman</button>

        <h3>Projects</h3>
        <div id="proj-container"></div>
        <button class="btn-add" onclick="addProject()">+ Tambah Project</button>
        
        <h3>Skills</h3>
        <div id="skill-container"></div>
        <button class="btn-add" onclick="addSkill()">+ Tambah Skill</button>

        <div class="action-bar">
            <button class="btn-download" onclick="downloadHTML()"><i class="fas fa-save"></i> Download index.html</button>
        </div>
    </div>

    <div class="preview-area">
        <iframe id="previewFrame"></iframe>
    </div>

    <script>
        // --- 1. DATA INITIALIZATION & UTILS ---
        
        // Template HTML untuk item baru
        function createInput(placeholder, className, type="text") {
            const input = document.createElement(type === 'textarea' ? 'textarea' : 'input');
            input.placeholder = placeholder;
            input.className = className;
            input.oninput = updatePreview;
            return input;
        }

        function createRemoveBtn(parent) {
            const btn = document.createElement('button');
            btn.innerHTML = '×';
            btn.className = 'btn-remove';
            btn.onclick = () => { parent.remove(); updatePreview(); };
            return btn;
        }

        // --- 2. DYNAMIC ADD FUNCTIONS ---

        function addExperience() {
            const container = document.getElementById('exp-container');
            const div = document.createElement('div');
            div.className = 'dynamic-item experience-item';
            
            div.appendChild(createRemoveBtn(div));
            div.appendChild(createInput("Posisi (misal: IT Officer)", "exp-role"));
            div.appendChild(document.createElement('br'));div.appendChild(document.createElement('br')); // spacer
            div.appendChild(createInput("Perusahaan & Tahun", "exp-comp"));
            div.appendChild(document.createElement('br'));div.appendChild(document.createElement('br'));
            div.appendChild(createInput("Deskripsi (Pemisah baris dengan Enter)", "exp-desc", "textarea"));

            container.appendChild(div);
            updatePreview();
        }

        function addProject() {
            const container = document.getElementById('proj-container');
            const div = document.createElement('div');
            div.className = 'dynamic-item project-item';
            
            div.appendChild(createRemoveBtn(div));
            div.appendChild(createInput("Nama Project (misal: GXdiag)", "proj-name"));
            div.appendChild(document.createElement('br'));div.appendChild(document.createElement('br'));
            div.appendChild(createInput("Teknologi (misal: Python, JS)", "proj-tech"));
            div.appendChild(document.createElement('br'));div.appendChild(document.createElement('br'));
            div.appendChild(createInput("Deskripsi Singkat", "proj-desc", "textarea"));
            div.appendChild(document.createElement('br'));div.appendChild(document.createElement('br'));
            div.appendChild(createInput("Link GitHub / Demo", "proj-link"));

            container.appendChild(div);
            updatePreview();
        }

        function addSkill() {
            const container = document.getElementById('skill-container');
            const div = document.createElement('div');
            div.className = 'dynamic-item skill-item';
            div.style.display = "flex"; div.style.gap = "10px"; div.style.alignItems = "center";

            div.appendChild(createRemoveBtn(div));
            // Icon select sederhana
            const iconSelect = document.createElement('select');
            iconSelect.className = 'skill-icon';
            iconSelect.innerHTML = `
                <option value="fas fa-code">Code</option>
                <option value="fas fa-network-wired">Network</option>
                <option value="fas fa-server">Server</option>
                <option value="fas fa-tools">Tools</option>
                <option value="fab fa-python">Python</option>
                <option value="fab fa-js">JavaScript</option>
                <option value="fas fa-users">Community</option>
            `;
            iconSelect.onchange = updatePreview;
            
            div.appendChild(iconSelect);
            div.appendChild(createInput("Nama Skill", "skill-name"));

            container.appendChild(div);
            updatePreview();
        }

        // --- 3. CORE GENERATOR LOGIC ---

        function generateFullHTML() {
            // Ambil data profile
            const name = document.getElementById('pName').value;
            const bio = document.getElementById('pBio').value;
            const photo = document.getElementById('pPhoto').value;
            const email = document.getElementById('cEmail').value;
            const wa = document.getElementById('cWa').value;
            const linkedin = document.getElementById('cLinkedin').value;

            // Generate HTML Experiences
            let expHTML = '';
            document.querySelectorAll('.experience-item').forEach(item => {
                const role = item.querySelector('.exp-role').value;
                const comp = item.querySelector('.exp-comp').value;
                const descRaw = item.querySelector('.exp-desc').value;
                
                // Ubah baris baru jadi <li>
                const descList = descRaw.split('\n').map(line => line ? `<li>${line}</li>` : '').join('');

                if(role) {
                    expHTML += `
                    <div class="job-item">
                        <h3>${role}</h3>
                        <p><strong>${comp}</strong></p>
                        <ul style="padding-left: 20px; margin-top: 5px; color: #ddd; font-size: 0.85rem;">
                            ${descList}
                        </ul>
                    </div>`;
                }
            });

            // Generate HTML Projects
            let projHTML = '';
            document.querySelectorAll('.project-item').forEach(item => {
                const name = item.querySelector('.proj-name').value;
                const tech = item.querySelector('.proj-tech').value;
                const desc = item.querySelector('.proj-desc').value;
                const link = item.querySelector('.proj-link').value;

                if(name) {
                    projHTML += `
                    <div class="job-item">
                        <h3>${name}</h3>
                        <p><strong>${tech}</strong></p>
                        <p style="font-size: 0.85rem; color: #ddd; margin-top: 5px;">${desc}</p>
                        <div style="margin-top: 10px;">
                            <a href="${link}" target="_blank" style="text-decoration: none; color: #FFD700; border: 1px solid #FFD700; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem;">Lihat Project</a>
                        </div>
                    </div>`;
                }
            });

            // Generate HTML Skills
            let skillHTML = '';
            document.querySelectorAll('.skill-item').forEach(item => {
                const icon = item.querySelector('.skill-icon').value;
                const name = item.querySelector('.skill-name').value;
                
                if(name) {
                    skillHTML += `
                    <li style="margin-bottom: 10px; display: flex; align-items: center; color: #eee;">
                        <i class="${icon}" style="width: 25px; color: #fff; margin-right: 10px;"></i> 
                        ${name}
                    </li>`;
                }
            });

            // Template Utama
            return `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio ${name}</title>
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"><\/script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
    <div class="container">
        <div class="profile">
            <img src="${photo}" alt="Foto Profil" class="avatar">
            <h1>${name}</h1>
            <p class="bio">${bio}</p>
            <div class="social-icons">
                <a href="mailto:${email}" title="Email"><i class="fas fa-envelope"></i> Email</a>
                <a href="https://wa.me/${wa}" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                <a href="${linkedin}" title="LinkedIn" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
            </div>
        </div>

        <div class="links">
            <button class="accordion">Experiences</button>
            <div class="panel">
                ${expHTML}
            </div>

            ${projHTML ? `<button class="accordion">Key Projects</button><div class="panel">${projHTML}</div>` : ''}

            <button class="accordion">Skills</button>
            <div class="panel">
                <ul style="list-style: none; padding: 0; margin-top: 15px;">
                    ${skillHTML}
                </ul>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 ${name}</p>
        </footer>
    </div>
    <script src="script.js"><\/script>
</body>
</html>`;
        }

        // --- 4. PREVIEW & DOWNLOAD ---

        function updatePreview() {
            const html = generateFullHTML();
            const iframe = document.getElementById('previewFrame');
            const doc = iframe.contentWindow.document;
            
            doc.open();
            doc.write(html);
            doc.close();

            // Inject CSS agar preview terlihat mirip aslinya tanpa load file eksternal (karena iframe blob)
            const styleElement = doc.createElement('style');
            styleElement.textContent = `
                body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); display:flex; justify-content:center; padding:20px; font-family:'Poppins'; color:white; }
                .container { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; text-align: center; width:100%; max-width:400px; border: 1px solid rgba(255,255,255,0.2); }
                .avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid white; object-fit: cover; }
                .social-icons a { display:inline-block; margin:5px; padding:8px 15px; border:1px solid white; border-radius:20px; color:white; text-decoration:none; font-size:0.8rem; }
                .accordion { background:white; color:#333; width:100%; padding:15px; border:none; border-radius:10px; margin-top:10px; font-weight:bold; display:block; text-align:left; margin-bottom:5px; }
                .panel { padding: 10px; background: rgba(0,0,0,0.2); border-radius: 5px; text-align: left; margin-bottom: 10px; }
                .job-item { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom:10px; margin-bottom:10px; }
            `;
            doc.head.appendChild(styleElement);
        }

        function downloadHTML() {
            const html = generateFullHTML();
            const blob = new Blob([html], { type: 'text/html' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'index.html';
            link.click();
        }

        // Initialize sample data on load
        window.onload = function() {
            addExperience(); // Sample empty slot
            addSkill(); // Sample empty slot
            updatePreview();
        };
    </script>
</body>
</html>
